name: Excavator

on:
  schedule:
    - cron: '0 8 * * *'   # täglich 08:00 UTC
  workflow_dispatch:

jobs:
  excavator:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # checkver.ps1 bindet ..\lib\*.ps1 ein und läuft daher nur aus einem
      # vollständigen Scoop-Checkout. Einzeln heruntergeladen scheitert es still.
      - name: Fetch Scoop
        shell: pwsh
        run: git clone --depth 1 https://github.com/ScoopInstaller/Scoop.git "$env:RUNNER_TEMP\scoop"

      - name: Check and update manifests
        shell: pwsh
        env:
          SCOOP: ${{ runner.temp }}\scoop-root
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & "$env:RUNNER_TEMP\scoop\bin\checkver.ps1" -App '*' -Dir "$PWD\bucket" -Update

      # Schlägt rot fehl, statt wieder monatelang still auf einer alten Version
      # stehen zu bleiben.
      - name: Verify manifest matches latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest  = (gh api repos/RTF22/VOCIX/releases/latest --jq .tag_name).TrimStart('v')
          $version = (Get-Content bucket/vocix.json | ConvertFrom-Json).version
          if ($version -ne $latest) {
            throw "bucket/vocix.json steht auf $version, aktuelles Release ist $latest"
          }
          Write-Host "bucket/vocix.json = $version (aktuell)"

      - name: Commit and push if changed
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            $version = (Get-Content bucket/vocix.json | ConvertFrom-Json).version
            git commit -m "Update vocix to $version"
            git push
          } else {
            Write-Host "Kein Update verfügbar."
          }
